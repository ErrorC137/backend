# MatDAO — Render Blueprint (fill in your URLs / secrets in the Render dashboard)
# Docs: https://render.com/docs/blueprint-spec

services:
  # Python IP Engine (TRL + IP Valuation + Due Diligence)
  - type: web
    name: matdao-ip-engine
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: OPENAI_API_KEY
        generateValue: true
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: DEEPSEEK_API_KEY
        generateValue: true
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://matdao-platform-v1-ms5jvg6it-scottgaming70-5109s-projects.vercel.app
      - key: REPORT_SIGNING_SECRET
        generateValue: true

  # Node TRL Services (R2C Leaderboard, AI Auditor, Co-founder Match)
  - type: web
    name: matdao-trl-services
    runtime: node
    rootDir: trl-services
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        generateValue: true
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://matdao-platform-v1-ms5jvg6it-scottgaming70-5109s-projects.vercel.app
      - key: NODE_VERSION
        value: "20"
