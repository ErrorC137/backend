# MatDAO — Render Blueprint (fill in your URLs / secrets in the Render dashboard)
# Docs: https://render.com/docs/blueprint-spec

services:
  # Python IP Engine (TRL + IP Valuation + Due Diligence)
  - type: web
    name: matdao-ip-engine
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && chmod +x backend/run.sh
    startCommand: bash backend/run.sh
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Multi-provider embedding configuration
      - key: EMBEDDING_PROVIDER_PRIORITY
        value: cohere,huggingface,openai
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_EMBEDDING_MODEL
        value: embed-english-v3.0
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_EMBEDDING_MODEL
        value: BAAI/bge-base-en-v1.5
      # Fallback providers
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: DEEPSEEK_API_KEY
        sync: false
      # Patent data sources
      - key: SERPAPI_KEY
        sync: false
      - key: LENS_API_KEY
        sync: false
      # Rate limiting configuration
      - key: RATE_LIMIT_REQUESTS
        value: "10"
      - key: RATE_LIMIT_WINDOW
        value: "60"
      - key: OPENAI_MAX_RETRIES
        value: "5"
      - key: OPENAI_RETRY_DELAY
        value: "1.0"
      - key: EMBEDDING_BATCH_SIZE
        value: "50"
      # CORS configuration
      - key: CORS_ALLOWED_ORIGINS
        value: https://matdao-platform-v1-ms5jvg6it-scottgaming70-5109s-projects.vercel.app
      - key: REPORT_SIGNING_SECRET
        generateValue: true

  # Node TRL Services (R2C Leaderboard, AI Auditor, Co-founder Match)
  - type: web
    name: matdao-trl-services
    runtime: node
    rootDir: trl-services
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://matdao-platform-v1-ms5jvg6it-scottgaming70-5109s-projects.vercel.app
      - key: NODE_VERSION
        value: "20"
